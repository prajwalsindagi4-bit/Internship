<!DOCTYPE html>
<html>
    <body>
        <head>
            <title>Table Example</title>
        </head>
        <p>Table one</p>
        <table border="1" width="50%">
            <tr>
                <td rowspan="3">April</td>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <td rowspan ="2">1</td>
                <td>7</td>
                <td>8</td>
            </tr>
            <tr>
                <td>9</td>
                <td>10</td>
            </tr>
        </table>
        <P>Table two</P>
        <table border="1" width="50%">
            <tr>
                <td colspan="3" style="text-align: center;">2022</td>
            </tr>
        </table>
    </body>
</html>
