<!DOCTYPE html>
<html>
    <head>
        <title>Flex</title>
        <style>
            .container{
                display: flex;
                flex-direction: row;
            }
            .box{
                width: 100px;
                height: 100px;
            }
            .box1{
                background-color: red;
            }
            .box2{
                background-color: green;
            }
            .box3{
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box" id="box1">1</div>
            <div class="box" id="box2">2</div>
            <div class="box" id="box3">3</div>
        </div>
    </body>
</html>
