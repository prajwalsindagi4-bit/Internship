<!DOCTYPE html>
<html>
    <title>Font Properties</title>
    <style>
        body{
            font-size: 20px;
        }
        #p1{
            font-family: 'Courier New', Courier, monospace;
            font-size: larger;
            font-weight: bold;
        }
        #p2{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

        }
        </style>
        <main>
            <p id="p1">This is a paragraph with Courier New font.</p>
            <p id="p2">This is a paragraph with Lucida Sans font.</p>
    </style>
</html>
